openapi: 3.1.0

info:
  title: Elitewear XI API
  version: "1.0.0"
  description: |
    Catálogo público de camisetas de fútbol y consulta de pedidos.

    La autenticación usa tokens de Sanctum. Se obtienen en `POST /v1/tokens`
    y se envían en la cabecera `Authorization: Bearer <token>`.

    Los importes viajan siempre en céntimos enteros. El campo `formatted`
    es una cortesía para pintar en pantalla, no un dato para calcular.

servers:
  - url: http://localhost:8000/api
    description: Desarrollo

tags:
  - name: Catálogo
  - name: Autenticación
  - name: Pedidos

paths:
  /v1/products:
    get:
      tags: [Catálogo]
      summary: Lista el catálogo publicado
      parameters:
        - { name: team, in: query, schema: { type: string }, description: Slug del equipo }
        - { name: season, in: query, schema: { type: string }, example: "1994-95" }
        - { name: min_price, in: query, schema: { type: integer }, description: Céntimos }
        - { name: max_price, in: query, schema: { type: integer }, description: Céntimos }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc, name] } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Página de productos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  meta: { type: object }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/products/{product}:
    get:
      tags: [Catálogo]
      summary: Una camiseta por slug
      parameters:
        - { name: product, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Producto con tallas e imágenes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '404':
          description: No existe o no está publicado

  /v1/tokens:
    post:
      tags: [Autenticación]
      summary: Emite un token de acceso
      description: Limitado a 10 intentos por minuto y por IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, maxLength: 60 }
      responses:
        '201':
          description: Token emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  abilities:
                    type: array
                    items: { type: string }
        '422':
          description: Credenciales incorrectas o demasiados intentos

    delete:
      tags: [Autenticación]
      summary: Revoca el token en uso
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Token revocado }

  /v1/orders:
    get:
      tags: [Pedidos]
      summary: Pedidos del usuario autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Página de pedidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401': { description: Falta el token }
        '403': { description: El token no tiene la habilidad orders:read }

  /v1/orders/{order}:
    get:
      tags: [Pedidos]
      summary: Un pedido por número
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: order, in: path, required: true, schema: { type: string }, example: RS-2026-000123 }
      responses:
        '200':
          description: Pedido con líneas
        '404':
          description: No existe o no es tuyo

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    ValidationError:
      description: Parámetros inválidos
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }

  schemas:
    Money:
      type: object
      properties:
        amount_cents: { type: integer, example: 8995 }
        currency: { type: string, example: EUR }
        formatted: { type: string, example: "89,95 €" }

    Product:
      type: object
      properties:
        slug: { type: string, example: ajax-1994-95-primera-equipacion }
        name: { type: string }
        season: { type: string, example: "1994-95" }
        kit_type: { type: string, enum: [home, away, third, goalkeeper] }
        price: { $ref: '#/components/schemas/Money' }
        team:
          type: object
          properties:
            slug: { type: string }
            name: { type: string }
            country: { type: string, example: NL }
        variants:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              size: { type: string, enum: [S, M, L, XL, XXL] }
              price: { $ref: '#/components/schemas/Money' }
              in_stock:
                type: boolean
                description: >
                  Disponibilidad, no cantidad. El inventario exacto es
                  información de negocio y no se expone.

    Order:
      type: object
      properties:
        number: { type: string, example: RS-2026-000123 }
        status: { type: string, enum: [pending, paid, shipped, delivered, cancelled, refunded] }
        placed_at: { type: string, format: date-time }
        totals:
          type: object
          properties:
            subtotal_cents: { type: integer }
            shipping_cents: { type: integer }
            total_cents: { type: integer }
            currency: { type: string }
