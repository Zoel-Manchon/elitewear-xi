name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: retro_shop_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, zip, gd, intl, exif, dom, xml
          coverage: none
          tools: composer:v2

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Instalar dependencias PHP
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Validar migraciones MySQL
        run: php artisan migrate:fresh --force
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: retro_shop_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Ejecutar tests
        run: php artisan test --colors=always
        env:
          # Explícito aunque phpunit.xml ya lo declare: en varios entornos las
          # variables del proceso ganan sobre las de phpunit, y los tests
          # acabarían corriendo contra la base de MySQL del job en vez de
          # SQLite en memoria. TestCase también lo fuerza, pero declararlo
          # aquí hace visible la intención.
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, gd, intl, zip, exif, dom, xml
          coverage: none
          tools: composer:v2

      - name: Validar Composer
        run: composer validate --strict --no-check-publish

      - name: Instalar dependencias PHP
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Ejecutar Larastan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Comprobar estilo con Pint
        run: vendor/bin/pint --test

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validar Composer
        run: composer validate --strict --no-check-publish

      - name: Auditar dependencias PHP
        run: composer audit --locked --no-interaction

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Compilar frontend
        run: npm run build

      - name: Auditar dependencias frontend
        run: npm audit --audit-level=high
