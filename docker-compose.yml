services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # true en local: instala faker (necesario para db:seed) y Pest.
        # En producción se construye sin este argumento, o con false.
        INSTALL_DEV: "true"
    volumes:
      - ./storage:/var/www/html/storage
      # El .env se monta en lugar de copiarse a la imagen: así sigue fuera
      # del build (.dockerignore lo excluye a propósito) pero artisan puede
      # leerlo y escribirlo, que es lo que necesita key:generate.
      - ./.env:/var/www/html/.env
      # public/ montado TAMBIÉN aquí, y este es el motivo:
      # la imagen trae su propia compilación de Vite y el host tiene otra.
      # @vite resolvía las URLs leyendo el manifiesto del contenedor mientras
      # nginx servía los ficheros del host: hashes distintos, 404 en el CSS
      # y la página sin estilos. Con el mismo montaje en los dos servicios
      # hay una sola verdad.
      - ./public:/var/www/html/public
      # Código montado en desarrollo.
      #
      # El Dockerfile hace COPY . . , así que sin estos montajes el contenedor
      # se queda con la copia del momento de la construcción y cualquier
      # cambio en el host exige un `docker compose build` completo. Se montan
      # las carpetas de código una a una y NO la raíz entera, para no tapar
      # vendor/ ni node_modules/ de la imagen.
      - ./app:/var/www/html/app
      - ./bootstrap:/var/www/html/bootstrap
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./tests:/var/www/html/tests
      - ./phpunit.xml:/var/www/html/phpunit.xml:ro
      - ./phpstan.neon:/var/www/html/phpstan.neon:ro
      - ./phpstan-baseline.neon:/var/www/html/phpstan-baseline.neon:ro
    env_file: .env
    environment:
      # Estos sobrescriben lo que venga del .env del host. Tu .env apunta a
      # la base de datos de Windows (puerto 3308); dentro de la red de
      # compose el servicio se llama "mysql" y escucha en el 3306.
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: retro_shirts
      DB_USERNAME: elitewear
      DB_PASSWORD: secret
      CACHE_STORE: file
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      # Se monta fuera de public para evitar un bind mount anidado dentro de
      # otro montaje de solo lectura. Nginx lo publica mediante `alias` en
      # /storage/, definido en docker/nginx/default.conf.
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: retro_shirts
      MYSQL_USER: elitewear
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    # Sin puerto publicado: la base de datos solo la ve la red de compose.
    # Si quieres conectarte con Workbench, descomenta y usa localhost:3307
    # para no chocar con tu MySQL de Windows.
    # ports:
    #   - "3307:3306"

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    command: >-
      sh -lc 'until php artisan migrate:status >/dev/null 2>&1; do sleep 2; done;
      exec php artisan queue:work --tries=3 --max-time=3600'
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
      - ./app:/var/www/html/app
      - ./bootstrap:/var/www/html/bootstrap
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: retro_shirts
      DB_USERNAME: elitewear
      DB_PASSWORD: secret
      CACHE_STORE: file
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql: