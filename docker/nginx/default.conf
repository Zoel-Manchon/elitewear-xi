server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 24M;

    # Las cabeceras de seguridad las pone SecurityHeaders en PHP para poder
    # calcular la CSP con el nonce. Aquí solo lo que nginx hace mejor.
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # storage/ sirve imágenes descargadas de terceros desde un montaje
    # independiente. `alias` evita montar storage dentro de public, que es
    # un bind mount de solo lectura en Docker Desktop.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
        expires 30d;
    }

    location ~ /\.(?!well-known) { deny all; }
}
