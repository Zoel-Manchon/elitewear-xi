memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 60

; Las imágenes remotas se descargan por HTTP con el cliente de Laravel, no
; con file_get_contents: no hace falta abrir wrappers de red.
allow_url_fopen = Off
allow_url_include = Off
expose_php = Off

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
